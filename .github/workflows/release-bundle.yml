name: Release bundle

# Builds the signed app bundle (.aab) that you upload to Google Play.
# Start it by hand: GitHub -> Actions -> "Release bundle" -> Run workflow.
# It needs four secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secrets
        env:
          K: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$K" ]; then echo "The upload key secrets are missing, see store/PUBLISHING.md"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Write the upload key
        env:
          K: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build the bundle (no test mode)
        env:
          HOP_KEYSTORE: ${{ runner.temp }}/upload.jks
          HOP_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          HOP_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          HOP_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-name=1.0.0 --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hopstone-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
